# =====================================================================
#  GreatestTrader 設定ファイル (config.yaml)
#  ※ 文字コード UTF-8 で保存してください。
#  ※ 記載のない項目はプログラム内の既定値が使われます。
# =====================================================================

# ---------------------------------------------------------------------
# MT5 口座 (空欄なら「起動中の MT5 ターミナルにログイン済みの口座」を使用)
# ---------------------------------------------------------------------
account:
  login:                     # 例: 12345678
  password:                  # 例: "your-password"   (平文保存に注意)
  server:                    # 例: "ICMarketsSC-Live07"
  terminal_path:             # 例: "C:/Program Files/MetaTrader 5/terminal64.exe"

# ---------------------------------------------------------------------
# ブローカー設定
# ---------------------------------------------------------------------
broker:
  symbol_suffix: ""          # 通貨ペア名の接尾辞。例 ".raw" "-STD" "m" (EURUSD.raw など)
  symbol_map: {}             # 個別に名前が違う場合: {"EURUSD": "EURUSDmicro"}
  server_time_mode: auto     # auto=自動判定 / ny7=GMT+2(冬)/+3(夏) / fixed=固定オフセット
  server_gmt_offset: 2.0     # fixed のときのサーバー時間の GMT オフセット(時間)
  commission_per_lot: 0.0    # 1ロット往復の手数料(口座通貨)。ECN口座は必ず設定 例: 7.0(USD口座) / 1000(JPY口座)
  deviation_points: 20       # 成行注文の許容スリッページ(ポイント)

# ---------------------------------------------------------------------
# リスク設定 = プリセット (v1.1)
#   preset: stable5               ★既定。月利5%目標＋ドローダウン抑制（過去検証: 月利5.4% / 最大DD約12% / 最悪月-4.8%）
#           stable4               より堅牢（中核ペアの1取引リスク2%）。過去検証: 月利4.4% / 最大DD約11% / 最悪月-3.7%
#           safe2                 最悪月 -2% 前後を優先。過去検証: 月利2.0% / 最大DD約12% / 最悪月-2.0%
#           classic_conservative / classic_standard / classic_aggressive   v1.0 と同じ考え方（保護機能なし）
#   ※ 3つの目標（月利5%・DD20%以内・最悪月-2%）を同時に満たすプリセットはありません。詳細は docs/05_安定化改修報告書.md
#   ※ 本番の最初は、下の risk: でリスクを半分にして始めてください（例: risk_nr: 0.0175, risk_es: 0.00875）。
#   プリセットの中身は python/greatest_trader/presets/*.yaml にあります。
#   下の risk: に書いた項目はプリセットより優先されます（書かなかった項目はプリセットの値のまま）。
# ---------------------------------------------------------------------
preset: stable5

# risk:                            # ← 個別に上書きしたい場合だけコメントを外して記入
#   risk_nr: 0.035                 # 中核4ペア(GBPCAD/EURCAD/AUDCAD/GBPCHF)の1取引リスク (0.035 = 3.5%)
#   risk_es: 0.0175                # Euro Session の1取引リスク
#   # symbol_risk_mult: 中核以外のペアのリスク倍率。書くと表全体が置き換わる（書かなかったペアは 1.0）ため、
#   #                   変更する場合はプリセットの 10 ペアをすべて書くこと
#   max_total_risk: 0.0875         # 同時に抱える損切りまでの合計リスク上限 (8.75%)
#   max_same_direction_per_currency: 2   # 同じ通貨を同じ方向に賭けるポジションは最大2
#   max_open_positions: 10         # 同時保有ポジション上限
#   max_positions_per_currency: 4  # 同一通貨を含むポジション数の上限
#   dd_scale_full: 0.10            # DD連動縮小: 倍率 = max(下限, 1 - DD/0.10)
#   dd_scale_floor: 0.10           # 縮小倍率の下限
#   daily_loss_limit: 0.01         # 当日 -1% で当日の新規停止
#   monthly_loss_limit: 0.0        # 当月 -x% で当月の新規停止 (0=オフ)
#   monthly_hard_stop: 0.03        # 当月 -3% で全決済し当月停止
#   max_drawdown_halt: 0.40        # 最高資産から -40% で全新規停止 (state/state.json を削除で解除)
#   blackout_start: "12-20"        # 年末年始は新規エントリーしない（12/20〜1/5、空欄でオフ）
#   blackout_end: "01-05"
#   min_lot_policy: skip           # 計算ロットが最小ロット未満: skip=見送り / min=最小ロットで発注

# ---------------------------------------------------------------------
# 戦略1: Night Reversion (主力) — 日付変更直後の平均回帰
# ---------------------------------------------------------------------
night_reversion:
  enabled: true
  symbols: [EURJPY, GBPJPY, USDJPY, GBPUSD, EURGBP, USDCHF, EURUSD,
            GBPCAD, EURCAD, AUDCAD, GBPCHF, EURAUD, CHFJPY, GBPAUD]
  bb_period: 15              # ボリンジャーバンド期間 (M15)
  bb_deviation: 1.8          # ボリンジャーバンド σ
  atr_period: 14             # ATR 期間 (M15)
  atr_cost_mult: 2.0         # ATR が取引コストの何倍以上で取引するか (コスト高の口座は 2.5〜3.0 推奨)
  sl_atr_mult: 3.0           # 損切り = ATR × 3
  max_hold_bars: 12          # 最大保有 12本 (3時間)
  entry_hours: [0, 1]        # エントリー判定する足の開始時刻 (マーケット時間 = NY+7)
  skip_monday: true          # 月曜早朝は取引しない
  slippage_pips: 0.5         # コスト計算に加えるスリッページ見込み(pips)
  max_spread_pips: 5.0       # これより広いスプレッドでは取引しない
  magic: 7101                # マジックナンバー (他EAと重複させない)

# ---------------------------------------------------------------------
# 戦略2: Euro Session (補助) — 欧州午前のユーロ安
# ---------------------------------------------------------------------
euro_session:
  enabled: true
  symbol: EURUSD
  direction: -1              # -1 = 売り
  entry_utc_hour: 7          # 07:00 UTC にエントリー
  exit_utc_hour: 13          # 13:00 UTC に決済
  weekdays: [0, 1, 2, 3, 4]  # 0=月 … 4=金 (UTC)
  atr_period_h1: 24          # 損切り計算用 ATR(H1)
  sl_atr_mult: 3.0           # 損切り = ATR(H1) × 3
  max_spread_pips: 2.0
  slippage_pips: 0.3
  magic: 7102

# ---------------------------------------------------------------------
# 通知 (任意) — 約定・エラー・停止をスマホ等に通知
# ---------------------------------------------------------------------
notify:
  discord_webhook: ""
  slack_webhook: ""
  telegram_bot_token: ""
  telegram_chat_id: ""

# ---------------------------------------------------------------------
# エンジン
# ---------------------------------------------------------------------
engine:
  dry_run: true              # ★true = 注文を出さずにシグナルのみ記録。本番は false (または --live-orders)
  poll_seconds: 5            # 監視間隔(秒)
  state_file: state/state.json
  log_dir: logs
  log_level: INFO
  history_bars: 300

# ---------------------------------------------------------------------
# Python バックテスト
# ---------------------------------------------------------------------
backtest:
  data_dir: data             # {SYMBOL}_M15.csv を置くフォルダ (python main.py download で作成)
  start:                     # 例 "2020-01-01" (空欄=データ全期間)
  end:
  initial_equity: 10000
  commission_pips: 0.0       # データのスプレッドに手数料が含まれない場合に加算する往復手数料(pips)
  output_dir: backtest_output
